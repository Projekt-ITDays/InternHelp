name: CI Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches-ignore: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

# Anuluj starsze runy z tej samej gałęzi, żeby nie marnować runnerów.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/workflows/ci.yml'

  check-backend:
    name: Build & Verify Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Backend Tests (Non-blocking)
        run: npm run test
        continue-on-error: true

      - name: Check NestJS compilation
        run: npm run build

  check-frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # Cache Angular cache directory, bo znacząco przyspiesza kolejne buildy.
      - name: Cache Angular build artifacts
        uses: actions/cache@v4
        with:
          path: ./frontend/.angular/cache
          key: ${{ runner.os }}-ng-${{ hashFiles('frontend/package-lock.json', 'frontend/angular.json', 'frontend/tsconfig.json', 'frontend/tsconfig.app.json') }}
          restore-keys: |
            ${{ runner.os }}-ng-

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Angular unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true

      - name: Check Angular compilation
        run: npm run build -- --configuration=production