services:

  db:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network

  api:
    build:
      context: ./backend
      dockerfile: dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    init: true
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app-network
      - db-network

  web:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        BUILD_CONFIGURATION: development
    ports:
      - "80:80"
    depends_on:
      - api
    init: true
    networks:
      - app-network
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
volumes:
  postgres-data: